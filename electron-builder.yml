appId: com.zaloauto.app
productName: zalo-auto
forceCodeSigning: false
directories:
  output: dist
files:
  - out/**
  - '!**/*.map'
extraResources:
  # keep browsers at a SHORT path (resources/browsers) — deep node_modules paths
  # exceed Windows MAX_PATH when electron-builder's NSIS --updated uninstall
  # renames files into $PLUGINSDIR\old-install, which breaks auto-update
  - from: resources/browsers
    to: browsers
  - from: resources/selectors.json
    to: selectors.json
  - from: resources/icon.png
    to: icon.png
  - from: resources/icon.ico
    to: icon.ico
win:
  icon: resources/icon.ico
  sign: null
  signAndEditExecutable: false
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
afterPack: scripts/afterPack.js
publish:
  provider: github
  owner: minhle20001998
  repo: zola-auto
