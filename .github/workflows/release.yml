name: release
on:
  push:
    tags:
      - 'v*'
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Install Playwright Chromium (bundled, short path)
        run: npx playwright install chromium
        env:
          # must match electron-builder.yml extraResources (resources/browsers -> browsers)
          PLAYWRIGHT_BROWSERS_PATH: resources/browsers
      - name: Build and publish
        run: npm run package -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
